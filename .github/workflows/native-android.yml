name: native-android

# Нативное приложение Blink для Android. Идёт только по веткам native/* и main, чтобы не тратить минуты на чужие правки.
on:
  push:
    branches: ["native/**", main]
    paths:
      - "native/android/**"
      - "native/design/**"
      - "native/tools/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  core-tests:
    name: Тесты ядра (чистая JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты
        run: ./gradlew -p core test --console=plain
      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: native/android/core/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          # На образе раннера SDK уже есть; докладываем платформу и принимаем лицензии, если чего-то не хватает.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Ключ входа (публичный)
        env:
          FROM_SECRET: ${{ secrets.BLINK_SUPABASE_ANON_KEY }}
        working-directory: .
        run: |
          key="$FROM_SECRET"
          if [ -z "$key" ]; then key="$(python3 native/tools/find_anon_key.py || true)"; fi
          if [ -n "$key" ]; then
            echo "::add-mask::$key"
            echo "BLINK_SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"
            echo "Ключ входа найден: приложение соберётся со входом."
          else
            echo "::warning::Ключ входа не найден: приложение соберётся без входа. Добавьте секрет BLINK_SUPABASE_ANON_KEY."
          fi
      - name: Сборка alpha
        run: ./gradlew :app:assembleAlpha --console=plain --stacktrace
      - name: Имя файла
        id: apk
        run: |
          src="$(ls app/build/outputs/apk/alpha/*.apk | head -n1)"
          out="app/build/outputs/Blink-android-alpha-${GITHUB_RUN_NUMBER}.apk"
          cp "$src" "$out"
          echo "path=native/android/$out" >> "$GITHUB_OUTPUT"
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: Blink-android-alpha
          path: ${{ steps.apk.outputs.path }}
      - name: Свежая сборка на странице релизов
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-alpha --cleanup-tag --yes || true
          gh release create android-alpha "${{ steps.apk.outputs.path }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Blink для Android, сборка ${GITHUB_RUN_NUMBER}" \
            --notes "Тестовая сборка (alpha). Ставится поверх предыдущей, сохранённые треки не пропадают. Ветка: ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}."

  emulator:
    name: Запуск в эмуляторе
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Blink-android-alpha
          path: apk
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор, APK, вкладки и поиск
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 native/tools/emulator_smoke.py
      - name: Снимки экрана (ветка ci-screens)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          tmp="$(mktemp -d)"
          cp -r shots/. "$tmp"/
          cd "$tmp"
          git init -q -b ci-screens
          git config user.name "blink-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Снимки экрана: сборка ${GITHUB_RUN_NUMBER}, коммит ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-shots
          path: shots
          if-no-files-found: ignore
