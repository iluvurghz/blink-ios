name: app-ios

# Blink для iPhone как на ПК: оболочка Capacitor со встроенной копией сайта (src/), работает и без интернета.
# Минуты macOS дорогие: по пушу собирается только сайт, .ipa и снимки из симулятора — по кнопке.
on:
  push:
    branches: ["app/**"]
    paths:
      - "ios/**"
      - ".github/workflows/app-ios.yml"
  workflow_dispatch:
    inputs:
      screens:
        description: "Запустить в симуляторе iPhone и снять экраны"
        type: boolean
        default: true

concurrency:
  group: app-ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  ipa:
    name: Сборка на macOS
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Xcode
        run: xcodebuild -version
      - name: Пакеты
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Публичные ключи сайта
        env:
          BLINK_SUPABASE_ANON_KEY: ${{ secrets.BLINK_SUPABASE_ANON_KEY }}
          BLINK_LASTFM_KEY: ${{ secrets.BLINK_LASTFM_KEY }}
        run: |
          python3 app-tools/site_env.py .env.production.local || echo "::warning::Ключ входа не найден, сборка без входа"
      - name: Сайт
        run: npx vite build
      - name: Сайт внутрь приложения
        run: |
          npx cap sync ios
          # Тестовые сборки ставятся поверх прошлых alpha (тот же идентификатор).
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = app.blink.player;/PRODUCT_BUNDLE_IDENTIFIER = app.blink.player.alpha;/' ios/App/App.xcodeproj/project.pbxproj
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Сборка без подписи
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*App/|BUILD" | head -80
      - name: Ошибки сборки
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true
      - name: Упаковка .ipa
        id: pack
        run: |
          app="build/Build/Products/Release-iphoneos/App.app"
          test -d "$app"
          rm -rf Payload && mkdir Payload && cp -R "$app" Payload/Blink.app
          out="Blink-ios-${{ github.run_number }}.ipa"
          zip -qry "$out" Payload
          ls -la "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Blink-ios
          path: ${{ steps.pack.outputs.path }}
      - name: Свежая сборка на странице релизов
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-ios --cleanup-tag --yes || true
          gh release create app-ios "${{ steps.pack.outputs.path }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Blink для iPhone (как сайт), сборка ${{ github.run_number }}" \
            --notes "Тестовая сборка без подписи: сайт Blink внутри приложения, работает и без интернета. Ставится через ваш сертификат (Sideloadly, AltStore, TrollStore). Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}."

      - name: Сборка для симулятора
        if: github.event_name == 'push' || inputs.screens
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath build-sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee build-sim.log | tail -n 5
      - name: Симулятор и снимки
        if: github.event_name == 'push' || inputs.screens
        timeout-minutes: 20
        run: |
          app="build-sim/Build/Products/Release-iphonesimulator/App.app"
          test -d "$app"
          sim="$(python3 native/tools/pick_simulator.py)"
          udid="$(printf '%s' "$sim" | cut -f1)"
          echo "Симулятор: $(printf '%s' "$sim" | cut -f2) ($udid)"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$udid" "$app"
          id=app.blink.player.alpha
          mkdir -p shots/ios
          alive() { xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -q "UIKitApplication:$id"; }
          shot() {
            xcrun simctl io "$udid" screenshot --type=png "shots/ios/$1.png" || true
            if alive; then echo "$1: ok" | tee -a shots/ios/report.txt; else echo "$1: ПРИЛОЖЕНИЯ НЕТ" | tee -a shots/ios/report.txt; fi
          }
          view() { xcrun simctl openurl "$udid" "$2"; sleep "$3"; shot "$1"; }
          xcrun simctl launch "$udid" "$id"
          sleep 1.2; shot 00-intro
          sleep 11; shot 01-home
          view 02-search "blink://view/search?q=%D0%A1%D0%BA%D1%80%D0%B8%D0%BF%D1%82%D0%BE%D0%BD%D0%B8%D1%82" 9
          view 03-charts "blink://view/charts" 8
          view 04-me "blink://view/me" 5
          view 05-plus "blink://view/plus" 5
          view 06-settings "blink://view/settings" 4
          view 07-params "blink://view/params" 4
          view 08-account "blink://view/account" 4
          xcrun simctl spawn "$udid" log show --style compact --last 5m --predicate 'process == "App"' > shots/ios/app.log 2>&1 || true
          ! grep -q "ПРИЛОЖЕНИЯ НЕТ" shots/ios/report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-shots
          path: shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-logs
          path: |
            build.log
            build-sim.log
          if-no-files-found: ignore
      - name: Снимки на странице релизов
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(shots/ios/*)
          [ "${#files[@]}" -gt 0 ] || exit 0
          gh release delete app-ios-screens --cleanup-tag --yes || true
          gh release create app-ios-screens "${files[@]}" --prerelease --target "$GITHUB_SHA" \
            --title "Blink для iPhone: снимки из симулятора, сборка ${{ github.run_number }}" \
            --notes "Проверка сборки ${{ github.run_number }} (коммит ${GITHUB_SHA::7}), не установочный файл."
