  <body>
    <div id="root"></div>
    <script>
      // Google sign-in from the desktop app lands here in the browser: hand the code back to Blink.
      if (new URLSearchParams(location.search).get('desktop') === '1') {
        document.body.style.cssText = 'margin:0;background:#0d0c10;color:#eee9e2;font:600 18px system-ui;display:grid;place-items:center;height:100vh';
        document.body.innerHTML = '<div style="text-align:center">Возвращаемся в Blink…<br><span style="color:#9a95a1;font-size:14px">Эту вкладку можно закрыть.</span></div>';
        location.replace('blink://auth' + location.search);
        window.__blinkHandoff = true;
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
