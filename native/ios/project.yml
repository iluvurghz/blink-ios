# Проект Xcode собирается из этого описания командой `xcodegen generate` (на macOS-раннере в CI).
# Сам Blink.xcodeproj в репозиторий не кладём: его не читают руками, а конфликты в нём бесполезны.
name: Blink

options:
  bundleIdPrefix: app.blink
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Публичный ключ входа. Пустой: приложение соберётся, но вход будет выключен. CI подставляет настоящий.
    BLINK_SUPABASE_ANON_KEY: ""

packages:
  BlinkCore:
    path: BlinkCore

targets:
  Blink:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: ../design/res/font
    dependencies:
      - package: BlinkCore
    settings:
      base:
        # Тестовая сборка живёт рядом с оболочкой ipa-3 (у неё app.blink.player) и не затирает её. Как на Android: суффикс .alpha.
        PRODUCT_BUNDLE_IDENTIFIER: app.blink.player.alpha
        PRODUCT_NAME: Blink
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Только iPhone: у XcodeGen в настройках цели по умолчанию «1,2», и оно перебивает общую настройку проекта.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Blink Alpha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities: [arm64]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Музыка играет при выключенном экране и в других приложениях.
        UIBackgroundModes: [audio]
        UIAppFonts:
          - manrope_regular.ttf
          - manrope_medium.ttf
          - manrope_semibold.ttf
          - manrope_bold.ttf
          - manrope_extrabold.ttf
          - unbounded_light.ttf
          - unbounded_medium.ttf
          - unbounded_semibold.ttf
          - unbounded_bold.ttf
        # Потоки внешних источников бывают по http: звук им разрешён, остальное нет.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
        ITSAppUsesNonExemptEncryption: false
        BlinkSupabaseAnonKey: $(BLINK_SUPABASE_ANON_KEY)
